name: Build release package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build FraudLabsPro package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -o "pluginVersion' => '[^']*'" zc_plugins/FraudLabsPro/manifest.php | head -1 | grep -o "[0-9][0-9.]*")
          fi

          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not determine version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Validate manifest version
        run: |
          set -euo pipefail

          MANIFEST_VERSION=$(grep -o "pluginVersion' => '[^']*'" zc_plugins/FraudLabsPro/manifest.php | head -1 | grep -o "[0-9][0-9.]*")
          if [[ "$MANIFEST_VERSION" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::Version mismatch: tag/workflow ${{ steps.version.outputs.version }}, manifest $MANIFEST_VERSION"
            exit 1
          fi

          CLASS_VERSION=$(grep -o "public const VERSION = '[^']*'" zc_plugins/FraudLabsPro/catalog/includes/classes/fraudlabspro/FraudLabsPro.php | grep -o "[0-9][0-9.]*")
          if [[ "$CLASS_VERSION" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::Version mismatch: tag/workflow ${{ steps.version.outputs.version }}, FraudLabsPro::VERSION $CLASS_VERSION"
            exit 1
          fi

      - name: Build package
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          STAGE="build"

          rm -rf "$STAGE"
          mkdir -p "$STAGE/zc_plugins/FraudLabsPro/$VERSION"

          rsync -a --exclude '.git' --exclude '.svn' \
            zc_plugins/FraudLabsPro/ "$STAGE/zc_plugins/FraudLabsPro/$VERSION/"

          cp README.md readme.html license.txt flp_orders.sql alter_flp_orders.sql "$STAGE/"
          cp -R images "$STAGE/images"

          cd "$STAGE"
          zip -r "../FraudLabsPro-v$VERSION.zip" \
            README.md readme.html license.txt flp_orders.sql alter_flp_orders.sql images zc_plugins

          cd ..
          ls -lh "FraudLabsPro-v$VERSION.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FraudLabsPro-v${{ steps.version.outputs.version }}
          path: FraudLabsPro-v${{ steps.version.outputs.version }}.zip

      - name: Attach package to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: FraudLabsPro-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
